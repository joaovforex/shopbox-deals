name: Qualidade e segurança

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun test
      # O repositório parte de um passivo de formatação legado. Mantemos o
      # relatório visível sem bloquear correções independentes até normalizá-lo
      # em um PR próprio, evitando uma reescrita massiva e arriscada agora.
      - name: Lint legado (diagnóstico)
        continue-on-error: true
        run: bun run lint
      - run: bun run build
